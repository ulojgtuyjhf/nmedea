<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>nmedea</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--surface:#f5f5f5;--border:rgba(0,0,0,0.09);--text:#111;--muted:#888}
html,body{height:100%;font-family:'Inter',sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
#browser{width:100%;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* TOOLBAR */
#toolbar{height:54px;background:#f0f0f0;display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0;border-bottom:1px solid var(--border);z-index:10}
.app-icon{width:30px;height:30px;border-radius:8px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.nav-btn{width:32px;height:32px;border-radius:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s}
.nav-btn:hover{background:rgba(0,0,0,0.07)}
.nav-btn svg{width:16px;height:16px}
#search-wrap{flex:1;position:relative;display:flex;align-items:center}
#search-bar{width:100%;height:36px;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:0 42px 0 36px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color 0.2s,box-shadow 0.2s}
#search-bar::placeholder{color:var(--muted)}
#search-bar:focus{border-color:rgba(0,0,0,0.3);box-shadow:0 0 0 3px rgba(0,0,0,0.05)}
#search-bar.ai-glow{border-color:transparent!important;animation:border-ai 2.5s linear infinite}
@keyframes border-ai{0%{box-shadow:0 0 0 2px #4f8ef7}25%{box-shadow:0 0 0 2px #9b72f7}50%{box-shadow:0 0 0 2px #f76b8a}75%{box-shadow:0 0 0 2px #f7c94f}100%{box-shadow:0 0 0 2px #4f8ef7}}
#bar-left-icon{position:absolute;left:12px;display:flex;align-items:center;pointer-events:none;color:#aaa}
#bar-left-icon svg{width:13px;height:13px}
#bar-left-icon.secure{color:#1a9e5c}
#url-label{position:absolute;left:36px;right:42px;font-size:12px;color:#444;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
#go-btn{position:absolute;right:5px;width:28px;height:28px;border-radius:50%;border:none;background:#111;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.15s;box-shadow:0 2px 8px rgba(0,0,0,0.18)}
#go-btn:hover{transform:scale(1.1) rotate(-10deg)}
#go-btn svg{width:12px;height:12px}
#dots-btn{width:32px;height:32px;border-radius:8px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s}
#dots-btn:hover{background:rgba(0,0,0,0.07)}
.dots-icon{display:flex;flex-direction:column;gap:3.5px;align-items:center}
.dots-icon span{width:4px;height:4px;border-radius:50%;background:#444;display:block}

/* PROGRESS */
#progress{height:2px;width:0%;background:linear-gradient(90deg,#4f8ef7,#9b72f7,#f76b8a,#f7c94f,#4f8ef7);background-size:300% 100%;transition:width 0.4s ease;flex-shrink:0;animation:pg 2s linear infinite}
@keyframes pg{0%{background-position:0%}100%{background-position:300%}}

/* SUGGESTIONS */
#suggestions{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.1);z-index:300;display:none;overflow:hidden}
.sug-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:#333;transition:background 0.1s}
.sug-item:hover{background:var(--surface)}
.sug-item svg{width:13px;height:13px;color:#bbb;flex-shrink:0}

/* DOTS PANEL */
#dots-panel{display:none;position:fixed;width:260px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.12);z-index:200;overflow:hidden}
#dots-panel.open{display:block;animation:panel-in 0.18s ease}
@keyframes panel-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.panel-profile{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
.panel-avatar{width:38px;height:38px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.panel-user-name{font-size:13.5px;font-weight:600}
.panel-user-sub{font-size:11px;color:var(--muted);margin-top:2px}
.panel-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);padding:11px 16px 5px}
.panel-history-list{padding:0 8px 8px;max-height:160px;overflow-y:auto}
.history-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;color:#333;transition:background 0.12s}
.history-item:hover{background:var(--surface)}
.history-item svg{width:12px;height:12px;color:var(--muted)}
.history-empty{font-size:12px;color:var(--muted);padding:8px 16px 12px}
.panel-divider{height:1px;background:var(--border);margin:4px 0}
.panel-action{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;color:#333;cursor:pointer;transition:background 0.12s}
.panel-action:hover{background:var(--surface)}
.panel-action svg{width:14px;height:14px;color:var(--muted)}

/* HOME */
#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.home-logo{font-size:38px;font-weight:700;letter-spacing:-1px;color:#111;margin-bottom:28px}
.home-logo span{color:#888;font-weight:300}
#home-search-wrap{position:relative;width:100%;max-width:520px}
#home-search{width:100%;height:46px;border:1.5px solid var(--border);border-radius:12px;padding:0 52px 0 18px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;background:#fff;transition:border-color 0.2s,box-shadow 0.2s}
#home-search::placeholder{color:#bbb}
#home-search:focus{border-color:rgba(0,0,0,0.25);box-shadow:0 0 0 3px rgba(0,0,0,0.05)}
#home-search.ai-glow{border-color:transparent!important;animation:border-ai 2.5s linear infinite}
#home-go{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;border:none;background:#111;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#home-go svg{width:14px;height:14px}
#home-suggestions{position:absolute;top:52px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.1);z-index:300;display:none;overflow:hidden}
#home-history{margin-top:22px;width:100%;max-width:520px;display:none}
#home-history.has-items{display:block}
.home-history-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#bbb;margin-bottom:8px}
#home-history-list{display:flex;flex-wrap:wrap;gap:6px}
.home-history-item{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:var(--surface);font-size:12px;color:#555;cursor:pointer;border:1px solid var(--border)}
.home-history-item svg{width:10px;height:10px;color:#bbb}

/* RESULT */
#result-page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform 0.3s cubic-bezier(.4,0,.2,1);z-index:5;pointer-events:none}
#result-page.visible{transform:translateY(0);pointer-events:all}
#result-scroll{flex:1;overflow-y:auto;padding:24px 20px 40px;display:flex;flex-direction:column;align-items:center}
.result-inner{width:100%;max-width:640px}
#query-echo{font-size:20px;font-weight:600;color:#111;margin-bottom:12px;line-height:1.3}

/* SHIMMER STATUS */
#status-wrap{margin-bottom:16px;min-height:22px}
.status-line{display:inline-block;font-size:13px;font-style:italic;color:transparent;background:linear-gradient(90deg,#bbb 0%,#111 40%,#bbb 80%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;animation:shine 1.5s linear infinite}
@keyframes shine{0%{background-position:200%}100%{background-position:-200%}}

/* SOURCE ICONS during search */
#live-sources{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;min-height:0}
.src-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--border);border-radius:20px;font-size:11px;color:#555;animation:pop-in 0.3s ease;text-decoration:none}
.src-chip:hover{background:var(--surface)}
@keyframes pop-in{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
.src-chip img{width:13px;height:13px;border-radius:2px}

/* ANSWER */
#card-body{font-size:14px;line-height:1.85;color:#222;white-space:pre-wrap}

/* shimmer placeholder */
.shim-block{height:13px;border-radius:6px;margin-bottom:10px;background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);background-size:200% 100%;animation:shim 1.2s infinite}
@keyframes shim{0%{background-position:200%}100%{background-position:-200%}}

/* IMAGES */
#images-out{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
#images-out img{height:120px;width:160px;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--border)}

/* RESULTS LIST */
#results-out{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.res-card{display:flex;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;text-decoration:none;color:inherit;transition:background 0.12s}
.res-card:hover{background:var(--surface)}
.res-card-favicon{width:28px;height:28px;border-radius:6px;flex-shrink:0;background:#eee}
.res-card-title{font-size:13px;font-weight:600;color:#111;margin-bottom:3px}
.res-card-desc{font-size:12px;color:var(--muted);line-height:1.5}
.res-card-domain{font-size:11px;color:#bbb;margin-top:3px}
</style>
</head>
<body>
<div id="browser">
  <div id="toolbar">
    <div class="app-icon">N</div>
    <button class="nav-btn" id="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="nav-btn" id="refresh-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <div id="search-wrap">
      <div id="bar-left-icon">
        <svg id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <svg id="icon-lock" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <input id="search-bar" type="text" placeholder="Ask anything…" autocomplete="off" spellcheck="false"/>
      <span id="url-label"></span>
      <button id="go-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
      <div id="suggestions"></div>
    </div>
    <button id="dots-btn"><div class="dots-icon"><span></span><span></span><span></span></div></button>
  </div>
  <div id="progress"></div>

  <div id="dots-panel">
    <div class="panel-profile">
      <div class="panel-avatar">N</div>
      <div><div class="panel-user-name">nmedea</div><div class="panel-user-sub">AI Browser</div></div>
    </div>
    <div class="panel-label">Recent</div>
    <div class="panel-history-list" id="panel-history"><div class="history-empty">No searches yet.</div></div>
    <div class="panel-divider"></div>
    <div class="panel-action" id="new-chat-panel-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Search
    </div>
  </div>

  <div id="home">
    <div class="home-logo">nmed<span>ea</span></div>
    <div id="home-search-wrap">
      <input id="home-search" type="text" placeholder="Ask me anything…" autocomplete="off"/>
      <button id="home-go">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
      <div id="home-suggestions"></div>
    </div>
    <div id="home-history">
      <div class="home-history-label">Recent</div>
      <div id="home-history-list"></div>
    </div>
  </div>

  <div id="result-page">
    <div id="result-scroll">
      <div class="result-inner">
        <div id="query-echo"></div>
        <div id="status-wrap"><span class="status-line" id="status-line" style="display:none"></span></div>
        <div id="live-sources"></div>
        <div id="card-body"></div>
        <div id="images-out"></div>
        <div id="results-out"></div>
      </div>
    </div>
  </div>
</div>

<script>
const searchBar     = document.getElementById('search-bar');
const homeSearch    = document.getElementById('home-search');
const goBtn         = document.getElementById('go-btn');
const homeGo        = document.getElementById('home-go');
const backBtn       = document.getElementById('back-btn');
const refreshBtn    = document.getElementById('refresh-btn');
const progress      = document.getElementById('progress');
const home          = document.getElementById('home');
const resultPage    = document.getElementById('result-page');
const queryEcho     = document.getElementById('query-echo');
const cardBody      = document.getElementById('card-body');
const liveSources   = document.getElementById('live-sources');
const imagesOut     = document.getElementById('images-out');
const resultsOut    = document.getElementById('results-out');
const statusLine    = document.getElementById('status-line');
const dotsBtn       = document.getElementById('dots-btn');
const dotsPanel     = document.getElementById('dots-panel');
const panelHistory  = document.getElementById('panel-history');
const barLeftIcon   = document.getElementById('bar-left-icon');
const iconSearch    = document.getElementById('icon-search');
const iconLock      = document.getElementById('icon-lock');
const urlLabel      = document.getElementById('url-label');
const suggestions   = document.getElementById('suggestions');
const homeSugg      = document.getElementById('home-suggestions');

let busy = false;
let lastQuery = '';
let currentUrl = '';
let searchHistory = JSON.parse(localStorage.getItem('nmh') || '[]');
let suggTimeout = null;

// AI-powered suggestions
async function fetchAISuggestions(val, box) {
  if (!val || val.length < 2) { box.style.display='none'; return; }
  try {
    const r = await fetch('/suggest', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query: val})
    });
    const data = await r.json();
    if (!data.suggestions || !data.suggestions.length) { box.style.display='none'; return; }
    box.innerHTML = data.suggestions.map(s => `
      <div class="sug-item" onmousedown="fillAndSearch(${JSON.stringify(s)})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        ${s}
      </div>`).join('');
    box.style.display = 'block';
  } catch(e) { box.style.display='none'; }
}

function onInput(input, box) {
  clearTimeout(suggTimeout);
  suggTimeout = setTimeout(() => fetchAISuggestions(input.value.trim(), box), 350);
}

searchBar.addEventListener('input', () => onInput(searchBar, suggestions));
homeSearch.addEventListener('input', () => onInput(homeSearch, homeSugg));

document.addEventListener('click', e => {
  if (!suggestions.contains(e.target) && e.target !== searchBar) suggestions.style.display='none';
  if (!homeSugg.contains(e.target) && e.target !== homeSearch) homeSugg.style.display='none';
  if (!dotsPanel.contains(e.target) && e.target !== dotsBtn) dotsPanel.classList.remove('open');
});

function openPanel(anchor) {
  const r = anchor.getBoundingClientRect();
  dotsPanel.style.top   = (r.bottom + 8) + 'px';
  dotsPanel.style.right = (window.innerWidth - r.right) + 'px';
  dotsPanel.classList.toggle('open');
  renderHistory();
}
dotsBtn.addEventListener('click', e => { e.stopPropagation(); openPanel(dotsBtn); });

function renderHistory() {
  const hEl   = document.getElementById('home-history');
  const hList = document.getElementById('home-history-list');
  if (!searchHistory.length) {
    panelHistory.innerHTML = '<div class="history-empty">No searches yet.</div>';
    hEl.classList.remove('has-items'); return;
  }
  panelHistory.innerHTML = searchHistory.slice().reverse().map(q => `
    <div class="history-item" onmousedown="fillAndSearch(${JSON.stringify(q)});dotsPanel.classList.remove('open')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>${q}</span>
    </div>`).join('');
  hEl.classList.add('has-items');
  hList.innerHTML = searchHistory.slice().reverse().slice(0,5).map(q => `
    <div class="home-history-item" onmousedown="fillAndSearch(${JSON.stringify(q)})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>${q}</span>
    </div>`).join('');
}

function setBarUrl(url) {
  currentUrl = url;
  iconSearch.style.display = 'none';
  iconLock.style.display = 'block';
  barLeftIcon.classList.add('secure');
  searchBar.style.color = 'transparent';
  urlLabel.style.display = 'block';
  urlLabel.textContent = url;
}

function setBarSearch() {
  iconSearch.style.display = 'block';
  iconLock.style.display = 'none';
  barLeftIcon.classList.remove('secure');
  searchBar.style.color = '';
  urlLabel.style.display = 'none';
}

function setProgress(p) { progress.style.width = p + '%'; }
function startGlow() { searchBar.classList.add('ai-glow'); homeSearch.classList.add('ai-glow'); }
function stopGlow()  { searchBar.classList.remove('ai-glow'); homeSearch.classList.remove('ai-glow'); }

function setStatus(msg) {
  if (!msg) { statusLine.style.display='none'; return; }
  statusLine.textContent = msg;
  statusLine.style.display = 'inline-block';
}

function showHome() {
  resultPage.classList.remove('visible');
  home.style.display = 'flex';
  searchBar.value = '';
  homeSearch.value = '';
  stopGlow();
  setBarSearch();
  lastQuery = '';
  setProgress(0);
  setStatus('');
  liveSources.innerHTML = '';
  renderHistory();
}

function fillAndSearch(q) {
  suggestions.style.display = 'none';
  homeSugg.style.display = 'none';
  searchBar.value = q;
  homeSearch.value = q;
  doSearch(q);
}

function addSourceChip(domain, url) {
  const a = document.createElement('a');
  a.className = 'src-chip';
  a.href = url;
  a.target = '_blank';
  a.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" onerror="this.style.display='none'"><span>${domain}</span>`;
  liveSources.appendChild(a);
}

async function doSearch(queryOverride) {
  const query = (queryOverride || searchBar.value || homeSearch.value).trim();
  if (!query || busy) return;
  busy = true;
  lastQuery = query;
  suggestions.style.display = 'none';
  homeSugg.style.display = 'none';

  if (!searchHistory.includes(query)) {
    searchHistory.push(query);
    if (searchHistory.length > 50) searchHistory.shift();
    localStorage.setItem('nmh', JSON.stringify(searchHistory));
  }
  renderHistory();

  home.style.display = 'none';
  resultPage.classList.add('visible');
  queryEcho.textContent = query;
  searchBar.value = query;
  cardBody.innerHTML = '';
  imagesOut.innerHTML = '';
  resultsOut.innerHTML = '';
  liveSources.innerHTML = '';
  startGlow();
  setProgress(10);
  setStatus('Reading what you mean…');

  // shimmer placeholder
  cardBody.innerHTML = `
    <div class="shim-block" style="width:100%"></div>
    <div class="shim-block" style="width:85%"></div>
    <div class="shim-block" style="width:60%"></div>
    <div class="shim-block" style="width:90%"></div>
    <div class="shim-block" style="width:75%"></div>`;

  // show sources appearing live as shimmer grows
  setProgress(30);
  await new Promise(r => setTimeout(r, 400));
  setStatus('Searching the web…');
  setProgress(55);
  await new Promise(r => setTimeout(r, 400));
  setStatus('Reading sources…');
  setProgress(75);
  await new Promise(r => setTimeout(r, 300));
  setStatus('Putting it together…');
  setProgress(90);

  try {
    const res = await fetch('/search', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query})
    });
    const data = await res.json();

    setProgress(100);
    stopGlow();
    setStatus('');
    await new Promise(r => setTimeout(r, 150));
    setProgress(0);

    if (data.action === 'open_website' && data.url) {
      window.location.href = data.url;
      busy = false;
      return;
    }

    // show source chips
    liveSources.innerHTML = '';
    if (data.sources && data.sources.length) {
      data.sources.forEach(s => addSourceChip(s.domain, s.url));
      setBarUrl(data.sources[0]?.url || query);
    } else {
      setBarUrl(query);
    }

    // clear shimmer, write answer
    cardBody.innerHTML = '';
    if (data.answer) {
      cardBody.textContent = data.answer;
    }

    // images
    imagesOut.innerHTML = '';
    if (data.images && data.images.length) {
      data.images.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.onclick = () => window.open(src, '_blank');
        imagesOut.appendChild(img);
      });
    }

    // results
    resultsOut.innerHTML = '';
    if (data.results && data.results.length) {
      data.results.forEach(r => {
        let domain = '';
        try { domain = new URL(r.url).hostname.replace('www.',''); } catch(e) {}
        const favicon = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
        const a = document.createElement('a');
        a.className = 'res-card';
        a.href = r.url;
        a.target = '_blank';
        a.innerHTML = `
          <img class="res-card-favicon" src="${favicon}" onerror="this.style.display='none'">
          <div>
            <div class="res-card-title">${r.title}</div>
            <div class="res-card-desc">${r.description}</div>
            <div class="res-card-domain">${domain}</div>
          </div>`;
        resultsOut.appendChild(a);
      });
    }

  } catch(e) {
    stopGlow();
    setProgress(0);
    setStatus('');
    cardBody.innerHTML = 'Something went wrong. Please try again.';
  }
  busy = false;
}

searchBar.addEventListener('focus', () => {
  searchBar.style.color = '';
  urlLabel.style.display = 'none';
  if (lastQuery) { searchBar.value = lastQuery; searchBar.select(); }
});
searchBar.addEventListener('blur', () => {
  setTimeout(() => { if (currentUrl) setBarUrl(currentUrl); }, 200);
});
searchBar.addEventListener('keydown', e => {
  if (e.key === 'Enter') { suggestions.style.display='none'; doSearch(); }
  if (e.key === 'Escape') { suggestions.style.display='none'; searchBar.blur(); }
});
homeSearch.addEventListener('keydown', e => {
  if (e.key === 'Enter') { homeSugg.style.display='none'; doSearch(); }
});
goBtn.addEventListener('click', () => doSearch());
homeGo.addEventListener('click', () => doSearch());
backBtn.addEventListener('click', showHome);
refreshBtn.addEventListener('click', () => { if(lastQuery) doSearch(lastQuery); });
document.getElementById('new-chat-panel-btn').addEventListener('click', () => {
  dotsPanel.classList.remove('open'); showHome();
});
renderHistory();
</script>
</body>
</html>
