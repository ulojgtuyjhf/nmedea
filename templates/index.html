<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentinel — Security API Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, Segoe UI, Arial, sans-serif; }
  body { background: #0b0f17; color: #e2e8f0; min-height: 100vh; }
  .container { max-width: 480px; margin: 0 auto; padding: 24px 18px 60px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #64748b; font-size: 14px; margin-bottom: 28px; }
  .card { background: #131a26; border: 1px solid #1f2937; border-radius: 14px; padding: 22px; margin-bottom: 16px; }
  input { width: 100%; background: #0b0f17; border: 1px solid #283446; color: #e2e8f0; border-radius: 10px; padding: 12px 14px; font-size: 15px; margin-bottom: 12px; }
  input:focus { outline: none; border-color: #3b82f6; }
  button { width: 100%; border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #3b82f6; color: white; }
  .btn-primary:hover { background: #2563eb; }
  .btn-secondary { background: #1f2937; color: #cbd5e1; margin-top: 8px; }
  .btn-danger { background: #7f1d1d; color: #fca5a5; }
  .btn-success { background: #14532d; color: #86efac; }
  .link-btn { background: none; color: #60a5fa; text-align: center; margin-top: 14px; font-size: 14px; }
  .error { background: #2a0f0f; color: #fca5a5; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; display: none; }
  .hidden { display: none !important; }
  .key-box { background: #0b0f17; border: 1px dashed #3b82f6; border-radius: 10px; padding: 14px; font-family: monospace; font-size: 13px; word-break: break-all; margin-bottom: 10px; color: #93c5fd; }
  .warn { color: #fbbf24; font-size: 12px; margin-bottom: 16px; }
  .status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .dot-live { background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 1.5s infinite; }
  .dot-paused { background: #64748b; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .toggle-btn { padding: 8px 18px; border-radius: 20px; font-size: 13px; width: auto; }
  .section-title { font-size: 13px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .event-row { border-left: 3px solid #3b82f6; padding: 10px 12px; background: #0b0f17; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
  .event-row.block { border-color: #ef4444; }
  .event-row .meta { color: #64748b; font-size: 11px; margin-top: 4px; }
  .empty-state { text-align: center; color: #475569; font-size: 13px; padding: 30px 0; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .logout { color: #64748b; font-size: 13px; cursor: pointer; }
  code.snippet { display: block; background: #0b0f17; border-radius: 8px; padding: 12px; font-size: 12px; color: #93c5fd; overflow-x: auto; white-space: pre; margin-top: 8px; }
</style>
</head>
<body>

<div class="container">

  <!-- AUTH VIEW -->
  <div id="authView">
    <h1>🛡️ Sentinel</h1>
    <p class="sub">Real-time attack detection for your app</p>

    <div class="card">
      <div id="authError" class="error"></div>

      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" />
        <input type="password" id="loginPassword" placeholder="Password" />
        <button class="btn-primary" onclick="login()">Log In</button>
        <button class="link-btn" onclick="showSignup()">Don't have an account? Sign up</button>
      </div>

      <div id="signupForm" class="hidden">
        <input type="email" id="signupEmail" placeholder="Email" />
        <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" />
        <button class="btn-primary" onclick="signup()">Create Account</button>
        <button class="link-btn" onclick="showLogin()">Already have an account? Log in</button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboardView" class="hidden">
    <div class="top-bar">
      <div>
        <h1>🛡️ Sentinel</h1>
        <p class="sub" style="margin-bottom:0">Dashboard</p>
      </div>
      <span class="logout" onclick="logout()">Log out</span>
    </div>

    <div id="noKeyCard" class="card hidden">
      <div class="section-title">Get started</div>
      <p style="font-size:14px;color:#94a3b8;margin-bottom:16px;">
        Generate an API key to start protecting your app.
      </p>
      <button class="btn-primary" onclick="createKey()">Generate API Key</button>
    </div>

    <div id="newKeyCard" class="card hidden">
      <div class="section-title">Your new API key</div>
      <p class="warn">⚠️ Copy this now — it won't be shown again.</p>
      <div class="key-box" id="newKeyValue"></div>
      <button class="btn-secondary" onclick="dismissNewKey()">I've copied it</button>
    </div>

    <div id="keyDashboard" class="card hidden">
      <div class="status-row">
        <div>
          <span class="dot" id="statusDot"></span>
          <span id="statusText" style="font-weight:600;"></span>
        </div>
        <button class="toggle-btn" id="toggleBtn" onclick="toggleKey()"></button>
      </div>

      <div class="section-title">Recent activity</div>
      <div id="eventsList"></div>
    </div>

    <div class="card" id="snippetCard">
      <div class="section-title">How to use this key</div>
      <p style="font-size:13px;color:#94a3b8;">Send each request you want checked to:</p>
      <code class="snippet" id="snippetText"></code>
    </div>
  </div>

</div>

<script>
// ---------------------------------------------------------------------------
// Firebase config — this part is MEANT to be public, sitting in the frontend.
// Security comes from your Firebase Security Rules (Realtime Database > Rules),
// not from hiding this object. Replace with your actual project's config.
// ---------------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyDnPz8BWCaXJOazlFVO4Eap8VxdSR2oDFQ",
  authDomain: "globalchat-2d669.firebaseapp.com",
  databaseURL: "https://globalchat-2d669-default-rtdb.firebaseio.com",
  projectId: "globalchat-2d669",
  storageBucket: "globalchat-2d669.firebasestorage.app",
  messagingSenderId: "178714711978",
  appId: "1:178714711978:web:e0d5888ae48170bd4bbdd3"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const dbRef = firebase.database();

let currentKeyId = null;
let pollTimer = null;

// ---------------------------------------------------------------------------
// Auth UI helpers
// ---------------------------------------------------------------------------
function showError(msg) {
  const el = document.getElementById("authError");
  el.textContent = msg;
  el.style.display = "block";
}
function clearError() {
  document.getElementById("authError").style.display = "none";
}
function showSignup() {
  clearError();
  document.getElementById("loginForm").classList.add("hidden");
  document.getElementById("signupForm").classList.remove("hidden");
}
function showLogin() {
  clearError();
  document.getElementById("signupForm").classList.add("hidden");
  document.getElementById("loginForm").classList.remove("hidden");
}

// ---------------------------------------------------------------------------
// Auth — directly against Firebase, no backend round-trip
// ---------------------------------------------------------------------------
function signup() {
  clearError();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;

  if (!email || password.length < 6) {
    showError("Enter a valid email and a password of at least 6 characters.");
    return;
  }

  auth.createUserWithEmailAndPassword(email, password)
    .catch(err => showError(err.message));
}

function login() {
  clearError();
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    showError("Enter your email and password.");
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
    .catch(err => showError(err.message));
}

function logout() {
  auth.signOut();
}

// Reacts to login/logout/signup automatically — Firebase handles the session.
auth.onAuthStateChanged(user => {
  if (user) {
    enterDashboard(user);
  } else {
    if (pollTimer) clearInterval(pollTimer);
    document.getElementById("dashboardView").classList.add("hidden");
    document.getElementById("authView").classList.remove("hidden");
  }
});

// ---------------------------------------------------------------------------
// Dashboard — reads/writes go straight to Firebase using the logged-in user's UID.
// This ONLY works safely if your Security Rules restrict each user to their
// own data, e.g.: "users_keys/$uid": { ".read": "auth.uid === $uid", ".write": "auth.uid === $uid" }
// ---------------------------------------------------------------------------
function enterDashboard(user) {
  document.getElementById("authView").classList.add("hidden");
  document.getElementById("dashboardView").classList.remove("hidden");
  loadKeys(user.uid);
}

function loadKeys(uid) {
  dbRef.ref(`user_keys/${uid}`).once("value").then(snapshot => {
    const keys = snapshot.val();
    if (!keys) {
      document.getElementById("noKeyCard").classList.remove("hidden");
      document.getElementById("keyDashboard").classList.add("hidden");
      return;
    }
    currentKeyId = Object.keys(keys)[0];
    document.getElementById("noKeyCard").classList.add("hidden");
    document.getElementById("keyDashboard").classList.remove("hidden");
    document.getElementById("snippetText").textContent =
      'POST ' + window.location.origin + '/api/check\nHeaders: { "x-api-key": "YOUR_KEY" }\nBody: { "ip": "1.2.3.4", "target": "login", "payload": "..." }';
    startPolling();
  });
}

// Key creation still calls the backend — generating + hashing a real secret
// key must happen server-side, never in the browser.
async function createKey() {
  const user = auth.currentUser;
  const idToken = await user.getIdToken();

  const res = await fetch("/api/keys/create", {
    method: "POST",
    headers: { "Authorization": "Bearer " + idToken },
  });
  const data = await res.json();

  currentKeyId = data.key_id;
  document.getElementById("noKeyCard").classList.add("hidden");
  document.getElementById("newKeyCard").classList.remove("hidden");
  document.getElementById("newKeyValue").textContent = data.api_key;
}

function dismissNewKey() {
  document.getElementById("newKeyCard").classList.add("hidden");
  loadKeys(auth.currentUser.uid);
}

async function toggleKey() {
  const dot = document.getElementById("statusDot");
  const isLive = dot.classList.contains("dot-live");
  const user = auth.currentUser;
  const idToken = await user.getIdToken();

  await fetch(`/api/keys/${currentKeyId}/toggle`, {
    method: "POST",
    headers: { "Authorization": "Bearer " + idToken, "Content-Type": "application/json" },
    body: JSON.stringify({ active: !isLive }),
  });
  refreshStatus();
}

async function refreshStatus() {
  if (!currentKeyId) return;
  const user = auth.currentUser;
  if (!user) return;
  const idToken = await user.getIdToken();

  const res = await fetch(`/api/status/${currentKeyId}`, {
    headers: { "Authorization": "Bearer " + idToken },
  });
  const data = await res.json();

  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");
  const btn = document.getElementById("toggleBtn");

  if (data.active) {
    dot.className = "dot dot-live";
    text.textContent = "Listening for attacks…";
    btn.textContent = "Pause";
    btn.className = "toggle-btn btn-danger";
  } else {
    dot.className = "dot dot-paused";
    text.textContent = "Paused";
    btn.textContent = "Run";
    btn.className = "toggle-btn btn-success";
  }

  const list = document.getElementById("eventsList");
  if (!data.recent_events || data.recent_events.length === 0) {
    list.innerHTML = '<div class="empty-state">No activity yet. Send a test request to /api/check to see it here.</div>';
    return;
  }

  list.innerHTML = data.recent_events.map(ev => {
    const time = new Date(ev.timestamp * 1000).toLocaleTimeString();
    const cls = ev.action === "block" ? "block" : "";
    return `<div class="event-row ${cls}">
      <strong>${ev.action.toUpperCase()}</strong> — ${ev.reason || ""}
      <div class="meta">${ev.detector || "unknown"} · IP ${ev.ip} · ${time}</div>
    </div>`;
  }).join("");
}

function startPolling() {
  refreshStatus();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshStatus, 4000);
}
</script>

</body>
</html>
