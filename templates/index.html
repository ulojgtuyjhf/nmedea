<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>nmedea · AI Vision Browser</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --surface: #111111;
            --card: #1a1a1a;
            --border: #2a2a2a;
            --text: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--bg);
        }

        /* Toolbar */
        .toolbar {
            padding: 16px 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-weight: 700;
            font-size: 1.3rem;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .new-btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text);
        }

        /* Camera - BIG and back camera */
        .camera-container {
            position: relative;
            background: #000;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(1);
        }

        .camera-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            z-index: 5;
        }

        .capture-btn {
            background: var(--accent);
            border: none;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.1s;
        }

        .capture-btn:active {
            transform: scale(0.94);
        }

        .capture-btn svg {
            width: 36px;
            height: 36px;
            stroke: white;
            stroke-width: 1.8;
        }

        .switch-cam-btn {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 1.5rem;
        }

        /* Response panel */
        .response-panel {
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            max-height: 35%;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .response-header {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .response-header h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .speak-btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .response-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .thinking {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
        }

        .dot-wave {
            display: flex;
            gap: 4px;
        }

        .dot-wave span {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: wave 1s infinite;
        }

        .dot-wave span:nth-child(2) { animation-delay: 0.1s; }
        .dot-wave span:nth-child(3) { animation-delay: 0.2s; }

        @keyframes wave {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        .history-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 16px;
            background: rgba(0,0,0,0.3);
        }

        .history-chip {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.7rem;
            white-space: nowrap;
            cursor: pointer;
        }

        @media (max-width: 550px) {
            .toolbar { padding: 12px 16px; }
            .capture-btn { width: 60px; height: 60px; }
            .response-content { font-size: 0.9rem; padding: 12px 16px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <div class="logo">
            <div class="logo-icon">🔮</div>
            <span>nmedea</span>
        </div>
        <button class="new-btn" id="clearVisionBtn">✨ New</button>
    </div>

    <!-- BIG CAMERA VIEW -->
    <div class="camera-container">
        <video id="camera" autoplay playsinline></video>
        <div class="camera-controls">
            <button class="switch-cam-btn" id="switchCameraBtn">🔄</button>
            <button class="capture-btn" id="captureBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
            <div style="width: 52px;"></div>
        </div>
    </div>

    <!-- AI RESPONSE PANEL -->
    <div class="response-panel">
        <div class="response-header">
            <h3>🤖 AI VISION</h3>
            <button class="speak-btn" id="speakBtn">
                🔊 Read Aloud
            </button>
        </div>
        <div class="response-content" id="responseText">
            <div class="thinking">
                <div class="dot-wave">
                    <span>●</span><span>●</span><span>●</span>
                </div>
                <span>Point camera at anything and press capture...</span>
            </div>
        </div>
        <div class="history-bar" id="historyBar"></div>
    </div>
</div>

<script>
    // Camera elements
    const video = document.getElementById('camera');
    const captureBtn = document.getElementById('captureBtn');
    const switchBtn = document.getElementById('switchCameraBtn');
    const responseDiv = document.getElementById('responseText');
    const speakBtn = document.getElementById('speakBtn');
    const clearBtn = document.getElementById('clearVisionBtn');
    const historyBar = document.getElementById('historyBar');

    let currentStream = null;
    let usingFrontCamera = false;
    let currentDescription = "";
    let visionHistory = [];

    // Load history from backend
    async function loadHistory() {
        try {
            const res = await fetch('/history');
            const data = await res.json();
            if (data.vision_history) {
                visionHistory = data.vision_history;
                renderHistoryBar();
            }
        } catch(e) { console.log(e); }
    }

    function renderHistoryBar() {
        if (!visionHistory.length) {
            historyBar.innerHTML = '<span style="font-size:0.7rem; color:#666; padding:4px;">No past captures</span>';
            return;
        }
        historyBar.innerHTML = visionHistory.slice(0, 8).map(item => `
            <div class="history-chip" onclick="loadHistoryDescription(\`${escapeText(item.description)}\`)">
                📸 ${item.description.substring(0, 35)}...
            </div>
        `).join('');
    }

    function escapeText(str) {
        return str.replace(/`/g, '\\`').replace(/\$/g, '\\$');
    }

    window.loadHistoryDescription = function(desc) {
        currentDescription = desc;
        responseDiv.innerHTML = `<div style="white-space: pre-wrap;">${desc}</div>`;
        speakCurrentDescription();
    };

    // Initialize camera with BACK camera (environment)
    async function initCamera(useFront = false) {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        
        const constraints = {
            video: {
                facingMode: useFront ? "user" : { exact: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            }
        };
        
        // Fallback if exact environment fails
        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch (err) {
            console.warn("Back camera failed, trying any camera", err);
            currentStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: useFront ? "user" : "environment" }
            });
        }
        
        video.srcObject = currentStream;
        await video.play();
        usingFrontCamera = useFront;
    }

    // Capture frame and send to backend
    async function captureAndAnalyze() {
        if (!video.videoWidth || !video.videoHeight) {
            responseDiv.innerHTML = '<span style="color: #ff6b6b;">⚠️ Camera not ready. Wait a moment.</span>';
            return;
        }

        // Show thinking state
        responseDiv.innerHTML = `
            <div class="thinking">
                <div class="dot-wave"><span>●</span><span>●</span><span>●</span></div>
                <span>🧠 AI is analyzing what it sees...</span>
            </div>
        `;

        // Capture frame
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageBase64 = canvas.toDataURL('image/jpeg', 0.9);

        try {
            const res = await fetch('/vision', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image: imageBase64,
                    query: "Describe what you see in detail. What's happening? What objects, people, colors, or actions do you notice?",
                    timestamp: new Date().toISOString()
                })
            });
            
            const data = await res.json();
            
            if (data.description) {
                currentDescription = data.description;
                responseDiv.innerHTML = `<div style="white-space: pre-wrap; line-height: 1.6;">${data.description}</div>`;
                // Auto-speak after capture
                speakCurrentDescription();
                // Reload history
                await loadHistory();
            } else {
                responseDiv.innerHTML = '<span style="color: #ff6b6b;">❌ AI couldn\'t process this. Try again with better lighting.</span>';
            }
        } catch (err) {
            console.error(err);
            responseDiv.innerHTML = '<span style="color: #ff6b6b;">❌ Network error. Is the backend running?</span>';
        }
    }

    function speakCurrentDescription() {
        if (!currentDescription || currentDescription === "") {
            responseDiv.innerHTML = '<span style="color: #ffaa44;">👆 First, capture something with the camera button.</span>';
            return;
        }
        
        if (!window.speechSynthesis) {
            alert("Speech not supported on this browser");
            return;
        }
        
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(currentDescription);
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        utterance.volume = 1;
        utterance.onstart = () => {
            const speakBtnEl = document.getElementById('speakBtn');
            if (speakBtnEl) speakBtnEl.style.opacity = '0.7';
        };
        utterance.onend = () => {
            const speakBtnEl = document.getElementById('speakBtn');
            if (speakBtnEl) speakBtnEl.style.opacity = '1';
        };
        window.speechSynthesis.speak(utterance);
    }

    // Switch camera between front/back
    switchBtn.addEventListener('click', async () => {
        await initCamera(!usingFrontCamera);
    });

    captureBtn.addEventListener('click', captureAndAnalyze);
    speakBtn.addEventListener('click', speakCurrentDescription);
    
    clearBtn.addEventListener('click', async () => {
        currentDescription = "";
        responseDiv.innerHTML = `
            <div class="thinking">
                <div class="dot-wave"><span>●</span><span>●</span><span>●</span></div>
                <span>Ready! Point camera at anything and press capture.</span>
            </div>
        `;
        window.speechSynthesis.cancel();
    });

    // Start with BACK camera (environment)
    initCamera(false);
    loadHistory();
</script>
</body>
</html>
