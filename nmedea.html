<style>
  :root {
    /* using the app's own "dim" mode palette - one step lighter
       than its default pitch-black theme */
    --ink:        #1a1d2e;
    --panel:      #22253a;
    --panel2:     #2a2d42;
    --line:       rgba(255,255,255,.1);
    --line2:      rgba(255,255,255,.16);
    --text:       #d8dae8;
    --muted:      #666a88;
    --signal:     #00e5ff;
    --signal2:    #7c3aed;
    --signal-dim: rgba(0,229,255,.1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: 'Outfit', -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    /* disable text selection / copying across the whole page,
       matching the app's own .msg-text/.msg-bubble approach */
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none; /* disables iOS long-press copy/save menu */
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 100%;
    padding: clamp(10px, 3vh, 16px) clamp(14px, 5vw, 20px) clamp(12px, 3vh, 18px);
    gap: clamp(4px, 1.2vh, 10px);
  }

  /* ---------- top mark ---------- */
  .brandmark {
    width: 100%;
    max-width: 440px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .wordmark-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .app-icon {
    width: clamp(18px, 5vw, 24px);
    height: clamp(18px, 5vw, 24px);
    border-radius: 6px;
    display: block;
  }

  .wordmark {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: clamp(15px, 4.2vw, 18px);
    letter-spacing: -0.03em;
  }

  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: clamp(8px, 2.4vw, 10px);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--signal);
    border: 1px solid rgba(58,171,143,0.5);
    background: rgba(58,171,143,0.16);
    padding: clamp(3px, 1vh, 4px) clamp(7px, 2vw, 9px);
    border-radius: 100px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 0 0 rgba(0,229,255,.5);
    animation: liveDotPulse 1.6s infinite;
    flex-shrink: 0;
  }

  @keyframes liveDotPulse {
    0%   { box-shadow: 0 0 0 0 rgba(0,229,255,.5); }
    70%  { box-shadow: 0 0 0 7px rgba(0,229,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,229,255,0); }
  }

  /* ---------- hero copy ---------- */
  .hero-text {
    max-width: 420px;
    text-align: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 6.2vw, 32px);
    line-height: 1.2;
    margin: 0 0 clamp(3px, 1vh, 6px);
    letter-spacing: -0.02em;
  }

  h1 em {
    font-style: normal;
    color: var(--signal);
  }

  .sub {
    color: var(--muted);
    font-size: clamp(11px, 3.2vw, 13px);
    line-height: 1.5;
    margin: 0 auto;
    max-width: 340px;
  }

  /* ---------- globe stage ---------- */
  .stage {
    position: relative;
    width: min(70vw, 28vh, 260px);
    height: min(70vw, 28vh, 260px);
    flex-shrink: 1;
    min-height: 80px;
  }

  .earth {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    /* earth diameter = 56% of the stage size - the SAME formula the
       ring radius is calculated from in JS, so there is always a
       guaranteed gap between the earth's edge and the flag ring */
    width: min(39.2vw, 15.68vh, 145.6px);
    height: min(39.2vw, 15.68vh, 145.6px);
    border-radius: 50%;
    object-fit: cover;
    display: block;
    filter: drop-shadow(0 0 16px rgba(58,171,143,0.14));
  }

  /* the ring rotates. it is a plain element with ONLY this animation
     and nothing else touching its transform - keeps it conflict-free. */
  .ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1px;
    height: 1px;
    animation: spin 16s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* each flag gets ONE transform, set once in JS: rotate to its angle,
     push out by radius, rotate back upright. No CSS animation on this
     element, so nothing overwrites that transform. */
  /* outer: positions the flag on the circle, never animates */
  .flagPos {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
  }

  /* inner: cancels the ring's spin in real time, so the flag itself
     always stays facing the same fixed direction, never tumbling,
     no matter where it travels on the circle */
  .flag {
    position: absolute;
    top: 0;
    left: 0;
    font-size: 20px;
    margin: -11px 0 0 -11px;
    animation: unspin 16s linear infinite;
  }

  @keyframes unspin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
  }

  /* ---------- download rail ---------- */
  .downloads {
    width: 100%;
    max-width: 380px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.4vh, 9px);
  }

  .rail-label {
    font-size: clamp(9px, 2.6vw, 10px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }

  .ms-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--signal), var(--signal2));
    border: none;
    border-radius: 10px;
    padding: clamp(9px, 2vh, 12px) clamp(12px, 4vw, 16px);
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(0,229,255,.28);
  }

  .hw-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--panel2);
    border: 1px solid var(--line2);
    border-radius: 10px;
    padding: clamp(7px, 1.6vh, 9px) clamp(12px, 4vw, 16px);
    text-decoration: none;
  }

  .hw-badge .hw-mark-box {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    border-radius: 4px;
    background: #C7000B;
    color: #fff;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }

  .hw-badge .hw-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .hw-badge .hw-text small {
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .hw-badge .hw-text strong {
    font-size: 15px;
    color: var(--text);
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .web-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: clamp(7px, 1.6vh, 9px) clamp(12px, 4vw, 16px);
    text-decoration: none;
  }

  .web-badge .web-mark {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    border-radius: 4px;
    display: block;
  }

  .web-badge .web-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .web-badge .web-text small {
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .web-badge .web-text strong {
    font-size: 15px;
    color: var(--text);
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .ms-badge .ms-logo {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1.5px;
    width: 17px;
    height: 17px;
    flex-shrink: 0;
  }
  .ms-logo i { display: block; }
  .ms-logo i:nth-child(1) { background: #F35325; }
  .ms-logo i:nth-child(2) { background: #81BC06; }
  .ms-logo i:nth-child(3) { background: #05A6F0; }
  .ms-logo i:nth-child(4) { background: #FFBA08; }

  .ms-badge .ms-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .ms-badge .ms-text small {
    font-size: 9.5px;
    color: rgba(0,0,0,0.6);
    letter-spacing: 0.02em;
  }
  .ms-badge .ms-text strong {
    font-size: 15px;
    color: #000;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .translate-note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    font-size: clamp(9.5px, 2.8vw, 11px);
    color: var(--muted);
    margin: clamp(4px, 1vh, 8px) 0 0;
  }

  .translate-icon {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    color: var(--signal);
  }
</style>
</head>
